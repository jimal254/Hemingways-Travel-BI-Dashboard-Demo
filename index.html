<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>Hemingways Travel · BI Dashboard</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.0/chart.umd.min.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box;}
body{background:#0A1628;font-family:'Segoe UI',sans-serif;color:#fff;min-height:100vh;}
.header{background:#0F1F3D;border-bottom:1px solid #1E3A5F;padding:14px 24px;display:flex;align-items:center;justify-content:space-between;}
.header-title{font-size:17px;font-weight:700;color:#C9A84C;}
.header-sub{font-size:10px;color:#94A3B8;margin-top:2px;}
.live-dot{width:7px;height:7px;border-radius:50%;background:#22C55E;box-shadow:0 0 8px #22C55E;animation:pulse 1.5s infinite;display:inline-block;margin-right:6px;}
.live-text{font-size:10px;color:#22C55E;font-weight:600;}
.headline{padding:14px 24px 0;font-size:14px;font-weight:600;min-height:28px;color:#fff;}
.cursor{opacity:0.6;animation:blink 0.8s infinite;}
.tabs{display:flex;gap:4px;padding:10px 24px 0;}
.tab{flex:1;background:transparent;color:#94A3B8;border:1px solid #1E3A5F;border-radius:8px 8px 0 0;padding:7px 0;font-size:11px;font-weight:700;cursor:pointer;text-transform:capitalize;transition:all 0.2s;}
.tab.active{background:#C9A84C;color:#0A1628;border-color:#C9A84C;}
.progress-bar{height:2px;background:#1E3A5F;border-radius:2px;overflow:hidden;margin-top:6px;}
.progress-fill{height:100%;background:#C9A84C;border-radius:2px;width:0%;transition:width 0.1s linear;}
.kpi-row{display:flex;gap:10px;margin:20px 24px;flex-wrap:wrap;}
.kpi-card{background:#111827;border:1px solid #1E3A5F;border-radius:12px;padding:18px 20px;flex:1;min-width:140px;transition:transform 0.4s,box-shadow 0.4s;}
.kpi-card.active{transform:translateY(-4px);}
.kpi-icon{font-size:22px;margin-bottom:4px;}
.kpi-val{font-size:26px;font-weight:700;font-family:monospace;}
.kpi-label{font-size:12px;color:#fff;font-weight:600;margin-top:4px;}
.content{padding:0 24px 20px;}
.grid-2{display:grid;grid-template-columns:1fr 1fr;gap:16px;}
.panel{background:#111827;border:1px solid #1E3A5F;border-radius:12px;padding:20px;opacity:0;transform:translateY(20px);transition:opacity 0.6s ease,transform 0.6s ease;}
.panel.visible{opacity:1;transform:translateY(0);}
.panel-title{font-size:12px;font-weight:700;color:#C9A84C;letter-spacing:1px;text-transform:uppercase;margin-bottom:4px;}
.panel-sub{font-size:11px;color:#94A3B8;margin-bottom:12px;}
.chart-wrap{position:relative;}
.stat-row{display:flex;gap:12px;flex-wrap:wrap;margin-top:16px;}
.stat-box{background:#0F1F3D;border-radius:10px;padding:10px 16px;border:1px solid #1E3A5F;}
.stat-label{font-size:10px;color:#94A3B8;}
.stat-val{font-size:17px;font-weight:700;margin-top:2px;}
.legend{display:flex;gap:16px;margin-top:10px;font-size:11px;color:#94A3B8;}
.footer{padding:10px 24px;border-top:1px solid #1E3A5F;display:flex;justify-content:space-between;align-items:center;margin-top:8px;}
.footer-left{font-size:10px;color:#94A3B8;}
.footer-right{font-size:10px;color:#C9A84C;}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:0.4}}
@keyframes blink{0%,100%{opacity:1}50%{opacity:0}}
</style>
</head>
<body>

<div class="header">
  <div>
    <div class="header-title">✈ Hemingways Travel · BI Dashboard</div>
    <div class="header-sub">FY 2024 · Power BI · Azure Synapse · ETL Pipelines</div>
  </div>
  <div style="display:flex;align-items:center;gap:8px;">
    <span class="live-dot"></span>
    <span class="live-text">LIVE</span>
    <button id="playBtn" onclick="togglePlay()" style="background:#C9A84C;color:#0A1628;border:none;border-radius:6px;padding:5px 14px;font-size:11px;font-weight:700;cursor:pointer;margin-left:8px;">⏸ Pause</button>
  </div>
</div>

<div class="headline" id="headline"><span id="typedText"></span><span class="cursor">|</span></div>

<div class="tabs" id="tabBar"></div>

<div class="kpi-row" id="kpiRow"></div>

<div class="content" id="content"></div>

<div class="footer">
  <div class="footer-left">Power BI · Azure Synapse · Automated ETL Pipelines · Python · SQL</div>
  <div class="footer-right">Jimmy Maina · jimal254.github.io</div>
</div>

<script>
const gold="#C9A84C",navy="#0A1628",lightNavy="#0F1F3D",cardBg="#111827",
      borderCol="#1E3A5F",textMuted="#94A3B8",green="#22C55E",red="#EF4444",blue="#3B82F6";

const months=["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
const revBefore=[210,195,230,215,240,260,275,255,235,245,268,290];
const revAfter=[220,218,265,252,285,310,330,308,278,291,315,342];
const cancRate=[18,17,15,13,12,11,10,10,9,8,8,7];
const channels={labels:["Direct Web","Travel Agents","Corporate","Referrals"],data:[38,27,20,15],colors:[gold,blue,"#8B5CF6","#06B6D4"]};
const segments=["Leisure","Corporate","Group","Honeymoon"];
const segBookings=[420,310,180,95];
const segRevenue=[185,248,142,118];

const tabs=["overview","revenue","cancellations","segments"];
const tabDurations=[6000,6000,5000,6000];
const headlines=[
  "Dashboard Overview — FY 2024 Performance",
  "Revenue Trend — +12% Growth After BI Implementation",
  "Cancellation Analysis — 20% Drop Achieved",
  "Customer Segments — Bookings & Revenue Breakdown"
];
const kpis=[
  {label:"Revenue Growth",target:12,suffix:"%",prefix:"+",color:green,icon:"📈"},
  {label:"Cancellation Drop",target:20,suffix:"%",prefix:"-",color:red,icon:"📉"},
  {label:"Reporting Time Saved",target:65,suffix:"%",prefix:"-",color:gold,icon:"⚡"},
  {label:"Data Accuracy",target:99.2,suffix:"%",prefix:"",color:blue,icon:"✅"},
];

let tabIdx=0,playing=true,charts={},timerStart=null,timerRaf=null,typeTimeout=null;

// Build tabs
const tabBar=document.getElementById("tabBar");
tabs.forEach((t,i)=>{
  const wrap=document.createElement("div");
  wrap.style.flex="1";
  const btn=document.createElement("button");
  btn.className="tab"+(i===0?" active":"");
  btn.id="tab-"+i;
  btn.textContent=t;
  btn.onclick=()=>{setPlaying(false);goToTab(i);};
  const pb=document.createElement("div");
  pb.className="progress-bar";
  pb.id="pb-wrap-"+i;
  pb.style.display="none";
  const pf=document.createElement("div");
  pf.className="progress-fill";
  pf.id="pb-"+i;
  pb.appendChild(pf);
  wrap.appendChild(btn);
  wrap.appendChild(pb);
  tabBar.appendChild(wrap);
});

// Build KPIs
const kpiRow=document.getElementById("kpiRow");
kpis.forEach((k,i)=>{
  const c=document.createElement("div");
  c.className="kpi-card";
  c.id="kpi-"+i;
  c.style.borderTop=`3px solid ${k.color}`;
  c.innerHTML=`<div class="kpi-icon">${k.icon}</div>
    <div class="kpi-val" id="kval-${i}" style="color:${k.color}">${k.prefix}0${k.suffix}</div>
    <div class="kpi-label">${k.label}</div>`;
  kpiRow.appendChild(c);
});

function animateKPIs(){
  kpis.forEach((k,i)=>{
    const el=document.getElementById("kval-"+i);
    const card=document.getElementById("kpi-"+i);
    card.classList.add("active");
    card.style.boxShadow=`0 8px 24px ${k.color}33`;
    let start=null;
    function step(ts){
      if(!start)start=ts;
      const p=Math.min((ts-start)/1800,1);
      const v=parseFloat((p*k.target).toFixed(1));
      el.textContent=k.prefix+v+k.suffix;
      if(p<1)requestAnimationFrame(step);
    }
    requestAnimationFrame(step);
  });
}

function typeHeadline(text){
  clearTimeout(typeTimeout);
  const el=document.getElementById("typedText");
  el.textContent="";
  let i=0;
  function next(){
    if(i<text.length){el.textContent=text.slice(0,++i);typeTimeout=setTimeout(next,35);}
  }
  next();
}

function destroyCharts(){
  Object.values(charts).forEach(c=>{try{c.destroy();}catch(e){}});
  charts={};
}

function makeChart(id,config){
  const canvas=document.getElementById(id);
  if(!canvas)return;
  charts[id]=new Chart(canvas,config);
}

const gridCfg={color:borderCol};
const tickCfg={color:textMuted,font:{size:10}};

function renderTab(){
  destroyCharts();
  const content=document.getElementById("content");
  content.innerHTML="";

  if(tabIdx===0){
    content.innerHTML=`
    <div class="grid-2">
      <div class="panel" id="p0"><div class="panel-title">Revenue Trend</div><div class="panel-sub">Before vs After BI ($K)</div><div class="chart-wrap"><canvas id="c-rev" height="180"></canvas></div></div>
      <div class="panel" id="p1" style="transition-delay:0.15s"><div class="panel-title">Booking Channels</div><div class="panel-sub">Revenue share by source</div><div class="chart-wrap"><canvas id="c-pie" height="180"></canvas></div></div>
      <div class="panel" id="p2" style="transition-delay:0.25s"><div class="panel-title">Cancellation Rate</div><div class="panel-sub">Monthly % decline</div><div class="chart-wrap"><canvas id="c-can" height="140"></canvas></div></div>
      <div class="panel" id="p3" style="transition-delay:0.35s"><div class="panel-title">Customer Segments</div><div class="panel-sub">Bookings vs Revenue</div><div class="chart-wrap"><canvas id="c-seg" height="140"></canvas></div></div>
    </div>`;
    setTimeout(()=>{
      ["p0","p1","p2","p3"].forEach(id=>document.getElementById(id)&&document.getElementById(id).classList.add("visible"));
      makeChart("c-rev",{type:"line",data:{labels:months,datasets:[
        {label:"Before",data:revBefore,borderColor:blue,backgroundColor:blue+"33",fill:true,tension:0.4,borderWidth:2,pointRadius:0},
        {label:"After BI",data:revAfter,borderColor:gold,backgroundColor:gold+"44",fill:true,tension:0.4,borderWidth:2.5,pointRadius:0}
      ]},options:{plugins:{legend:{labels:{color:textMuted,font:{size:10}}}},scales:{x:{grid:gridCfg,ticks:tickCfg},y:{grid:gridCfg,ticks:{...tickCfg,callback:v=>`$${v}K`}}}}});
      makeChart("c-pie",{type:"doughnut",data:{labels:channels.labels,datasets:[{data:channels.data,backgroundColor:channels.colors,borderWidth:0}]},options:{plugins:{legend:{labels:{color:textMuted,font:{size:10}}}},cutout:"60%"}});
      makeChart("c-can",{type:"line",data:{labels:months,datasets:[{label:"Rate",data:cancRate,borderColor:red,backgroundColor:red+"22",fill:true,tension:0.4,borderWidth:2.5,pointRadius:3,pointBackgroundColor:red}]},options:{plugins:{legend:{display:false}},scales:{x:{grid:gridCfg,ticks:tickCfg},y:{grid:gridCfg,ticks:{...tickCfg,callback:v=>`${v}%`},min:4,max:22}}}});
      makeChart("c-seg",{type:"bar",data:{labels:segments,datasets:[{label:"Bookings",data:segBookings,backgroundColor:blue,borderRadius:4},{label:"Revenue $K",data:segRevenue,backgroundColor:gold,borderRadius:4}]},options:{plugins:{legend:{labels:{color:textMuted,font:{size:10}}}},scales:{x:{grid:gridCfg,ticks:tickCfg},y:{grid:gridCfg,ticks:tickCfg}}}});
    },100);
  }

  else if(tabIdx===1){
    content.innerHTML=`
    <div class="panel" id="p0"><div class="panel-title">Full-Year Revenue Analysis</div><div class="panel-sub">Before vs After BI Implementation ($K)</div><div class="chart-wrap"><canvas id="c-rev2" height="300"></canvas></div>
    <div class="stat-row">
      <div class="stat-box"><div class="stat-label">Peak Month</div><div class="stat-val" style="color:${gold}">Dec · $342K</div></div>
      <div class="stat-box"><div class="stat-label">Annual Growth</div><div class="stat-val" style="color:${green}">+12% YoY</div></div>
      <div class="stat-box"><div class="stat-label">Best Month</div><div class="stat-val" style="color:${blue}">Jul · +20%</div></div>
    </div></div>`;
    setTimeout(()=>{
      document.getElementById("p0").classList.add("visible");
      makeChart("c-rev2",{type:"line",data:{labels:months,datasets:[
        {label:"Before",data:revBefore,borderColor:blue,backgroundColor:blue+"33",fill:true,tension:0.4,borderWidth:2,pointRadius:3},
        {label:"After BI",data:revAfter,borderColor:gold,backgroundColor:gold+"44",fill:true,tension:0.4,borderWidth:3,pointRadius:3}
      ]},options:{plugins:{legend:{labels:{color:textMuted,font:{size:12}}}},scales:{x:{grid:gridCfg,ticks:{color:textMuted,font:{size:12}}},y:{grid:gridCfg,ticks:{color:textMuted,font:{size:12},callback:v=>`$${v}K`}}}}});
    },100);
  }

  else if(tabIdx===2){
    content.innerHTML=`
    <div class="panel" id="p0"><div class="panel-title">Cancellation Rate Reduction</div><div class="panel-sub">Monthly cancellation % — pricing & marketing strategy adjustments</div><div class="chart-wrap"><canvas id="c-can2" height="280"></canvas></div>
    <div class="legend"><span style="color:${red}">● High (&gt;14%)</span><span style="color:${gold}">● Medium (11–14%)</span><span style="color:${green}">● Low (≤10%)</span></div></div>`;
    setTimeout(()=>{
      document.getElementById("p0").classList.add("visible");
      const barColors=cancRate.map(r=>r<=10?green:r<=14?gold:red);
      makeChart("c-can2",{type:"bar",data:{labels:months,datasets:[{label:"Cancellation %",data:cancRate,backgroundColor:barColors,borderRadius:6}]},options:{plugins:{legend:{display:false}},scales:{x:{grid:gridCfg,ticks:{color:textMuted,font:{size:12}}},y:{grid:gridCfg,ticks:{color:textMuted,font:{size:12},callback:v=>`${v}%`},min:0,max:25}}}});
    },100);
  }

  else if(tabIdx===3){
    content.innerHTML=`
    <div class="grid-2">
      <div class="panel" id="p0"><div class="panel-title">Bookings by Segment</div><div class="panel-sub">Volume by customer type</div><div class="chart-wrap"><canvas id="c-sb" height="240"></canvas></div></div>
      <div class="panel" id="p1" style="transition-delay:0.15s"><div class="panel-title">Revenue by Segment ($K)</div><div class="panel-sub">Highest value segments</div><div class="chart-wrap"><canvas id="c-sr" height="240"></canvas></div></div>
    </div>`;
    setTimeout(()=>{
      ["p0","p1"].forEach(id=>document.getElementById(id)&&document.getElementById(id).classList.add("visible"));
      const hOpts={indexAxis:"y",plugins:{legend:{display:false}},scales:{x:{grid:gridCfg,ticks:tickCfg},y:{grid:{display:false},ticks:{color:"#fff",font:{size:12}}}}};
      makeChart("c-sb",{type:"bar",data:{labels:segments,datasets:[{data:segBookings,backgroundColor:blue,borderRadius:6}]},options:hOpts});
      makeChart("c-sr",{type:"bar",data:{labels:segments,datasets:[{data:segRevenue,backgroundColor:gold,borderRadius:6}]},options:{...hOpts,scales:{...hOpts.scales,x:{...hOpts.scales.x,ticks:{...tickCfg,callback:v=>`$${v}K`}}}}});
    },100);
  }
}

function goToTab(i){
  cancelAnimationFrame(timerRaf);
  tabs.forEach((_,j)=>{
    document.getElementById("tab-"+j).classList.toggle("active",j===i);
    document.getElementById("pb-wrap-"+j).style.display="none";
    document.getElementById("pb-"+j).style.width="0%";
  });
  tabIdx=i;
  typeHeadline(headlines[i]);
  renderTab();
  animateKPIs();
  if(playing) startTimer();
}

function startTimer(){
  cancelAnimationFrame(timerRaf);
  const pbWrap=document.getElementById("pb-wrap-"+tabIdx);
  const pb=document.getElementById("pb-"+tabIdx);
  pbWrap.style.display="block";
  pb.style.width="0%";
  timerStart=null;
  const dur=tabDurations[tabIdx];
  function step(ts){
    if(!timerStart)timerStart=ts;
    const p=Math.min((ts-timerStart)/dur,1);
    pb.style.width=(p*100)+"%";
    if(p<1)timerRaf=requestAnimationFrame(step);
    else goToTab((tabIdx+1)%tabs.length);
  }
  timerRaf=requestAnimationFrame(step);
}

function setPlaying(val){
  playing=val;
  document.getElementById("playBtn").textContent=playing?"⏸ Pause":"▶ Play";
  if(playing)startTimer();
  else{cancelAnimationFrame(timerRaf);tabs.forEach((_,j)=>{document.getElementById("pb-wrap-"+j).style.display="none";});}
}

function togglePlay(){setPlaying(!playing);}

// Init
goToTab(0);
</script>
</body>
</html>
